name: Preview package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact preview source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify source and quality gates
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Package exact commit
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          ./scripts/package.ps1 -Version $version -Commit '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Smoke fresh extraction
        shell: pwsh
        run: |
          $package = Get-Item -LiteralPath "./artifacts/release/NvtEventBufferReplay-v${{ steps.package.outputs.version }}-win-x64.zip"
          ./scripts/smoke-release.ps1 -PackagePath $package.FullName -SkipUiLaunch

      - name: Upload short-lived preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NvtEventBufferReplay-v${{ steps.package.outputs.version }}-win-x64-preview
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
