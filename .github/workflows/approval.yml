name: approval

# PR merge ref supplies this workflow; base checkout supplies the checker/policy.
# Base moves emit no PR event: up-to-date and merger checks cover staleness; dual-event ruleset selection needs live verification.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited,
            converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: governance / approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Resolve checked-out base SHA
        run: |
          base_sha=$(git rev-parse HEAD)
          echo "APPROVAL_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
      - name: Check approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVAL_REPOSITORY: ${{ github.repository }}
          APPROVAL_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: >-
          python -B scripts/approval_check.py
          --repository "$APPROVAL_REPOSITORY"
          --pull-request "$APPROVAL_PULL_REQUEST"
          --checked-out-base "$APPROVAL_BASE_SHA"
          --summary "$GITHUB_STEP_SUMMARY"
