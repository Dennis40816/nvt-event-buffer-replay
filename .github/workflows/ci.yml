name: CI

on:
  push:
    branches: [main, '[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  health:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Fetch Core packages
        if: hashFiles('scripts/fetch_core_packages.py') != ''
        timeout-minutes: 3
        run: python -B scripts/fetch_core_packages.py

      - name: Restore
        timeout-minutes: 5
        run: dotnet restore Nvt.EventBufferReplay.sln --locked-mode

      - name: Read the Core pin
        id: pin
        shell: pwsh
        run: |
          $lock = Get-Content -Raw -LiteralPath eng/core-health.lock.json | ConvertFrom-Json
          if ($lock.coreCommit -cnotmatch '^[0-9a-f]{40}\z') { throw 'eng/core-health.lock.json: coreCommit is not a 40-character lowercase SHA.' }
          "commit=$($lock.coreCommit)" >> $env:GITHUB_OUTPUT

      - name: Check out Core at the pin
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Dennis40816/nvt_fw_core
          ref: ${{ steps.pin.outputs.commit }}
          path: .core
          fetch-depth: 0
          persist-credentials: false

      # Compare ledgers and the Core bundle with the base, not with HEAD, so a change cannot edit a ledger
      # and the debt it hides in the same commit (repo-health.md: application CI must pass -BaseRef).
      # -CoreRoot makes the checker prove that the six bundle copies equal the blobs at the pinned Core commit.
      # The checker itself is the application copy under tools/repo-checks. Its identity is checked once the
      # lock has a repo-health.ps1 entry, which the pin synchronization adds.
      - name: Verify repository health (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./tools/repo-checks/repo-health.ps1 -Mode Verify -Repo nfu -Root . -Solution Nvt.EventBufferReplay.sln -BaseRef "origin/$env:BASE_REF" -CoreRoot ./.core

      - name: Verify repository health (push)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          $arguments = @{ Mode = 'Verify'; Repo = 'nfu'; Root = '.'; Solution = 'Nvt.EventBufferReplay.sln'; CoreRoot = './.core' }
          if ($env:PUSH_BEFORE -and $env:PUSH_BEFORE -notmatch '^0+$') {
            git cat-file -e "$($env:PUSH_BEFORE)^{commit}" 2>$null
            if ($LASTEXITCODE -eq 0) { $arguments.BaseRef = $env:PUSH_BEFORE }
          }
          ./tools/repo-checks/repo-health.ps1 @arguments

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Check documentation sync (warn)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          DOC_SYNC_BASE: origin/${{ github.base_ref }}
        run: |
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $bodyFile = Join-Path $env:RUNNER_TEMP 'doc-sync-pr-body.txt'
          [IO.File]::WriteAllText($bodyFile, [string]$event.pull_request.body, [Text.UTF8Encoding]::new($false))
          python -B tools/repo-checks/doc_sync.py --repo . --config tools/repo-checks/doc-sync.nfu.json --base $env:DOC_SYNC_BASE --pr-body-file $bodyFile --mode warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch Core packages
        if: hashFiles('scripts/fetch_core_packages.py') != ''
        timeout-minutes: 3
        run: python -B scripts/fetch_core_packages.py

      - name: Restore
        timeout-minutes: 5
        run: dotnet restore Nvt.EventBufferReplay.sln --locked-mode

      - name: Build
        timeout-minutes: 5
        run: dotnet build Nvt.EventBufferReplay.sln --configuration Release --no-restore

      - name: Test
        timeout-minutes: 7
        run: dotnet test Nvt.EventBufferReplay.sln --configuration Release --no-build

      - name: Enforce handwritten per-file line ceiling
        shell: pwsh
        run: ./scripts/check-line-budget.ps1

      - name: Test line ceiling checker
        shell: pwsh
        run: ./scripts/test-line-budget.ps1

      - name: Run performance smoke gate
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/performance-gate.ps1 -Mode Smoke
