name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Nvt.EventBufferReplay.sln

      - name: Build
        run: dotnet build Nvt.EventBufferReplay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Nvt.EventBufferReplay.sln --configuration Release --no-build
